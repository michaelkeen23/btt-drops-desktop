<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BTT Drops — offline</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#05070d; color:#fff; font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .box { text-align:center; max-width:380px; padding:24px; }
  .mark { font-size:22px; font-weight:900; margin-bottom:6px; }
  .mark span { color:#38bdf8; }
  p { color:rgba(255,255,255,.5); font-size:13px; }
  button { margin-top:16px; border:none; border-radius:8px; padding:9px 18px; font-size:13px; font-weight:800;
           background:#38bdf8; color:#000; cursor:pointer; }
  button:hover { background:#0ea5e9; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">btt<span>/drops</span></div>
    <p>Can’t reach firetickets.ai right now. Drop alerts keep polling in the background and will come
       through the moment the connection is back.</p>
    <button onclick="location.href='https://www.firetickets.ai/btt/drops'">Try again</button>
  </div>
</body>
</html>
