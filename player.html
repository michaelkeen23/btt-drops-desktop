<!doctype html>
<html>
<head><meta charset="utf-8"><title>Drop checker audio</title></head>
<body style="background:#05070d">
<!--
  Hidden audio host. The main process can't play sound itself, and the visible window spends most of its
  life closed to the tray — so alert playback lives in this window, which is never shown and never closed.
  A fresh Audio() per play means overlapping alerts stack instead of cutting each other off.
-->
<script>
  window.bdPlayer.onPlay(function (p) {
    if (!p || !p.url) return;
    try {
      var a = new Audio(p.url);
      a.volume = typeof p.volume === 'number' ? Math.max(0, Math.min(1, p.volume)) : 0.8;
      a.addEventListener('ended', function () { a.src = ''; });
      a.addEventListener('error', function () {
        window.bdPlayer.report(false, 'cannot decode ' + p.url);
      });
      a.play().then(
        function () { window.bdPlayer.report(true, null); },
        function (e) { window.bdPlayer.report(false, (e && e.message) || 'play() rejected'); }
      );
    } catch (e) {
      // A missing or unreadable sound file must never take the app down.
      window.bdPlayer.report(false, (e && e.message) || String(e));
    }
  });
</script>
</body>
</html>
